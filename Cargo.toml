[workspace]
resolver = "2"
members = [
    "crates/rtio",
    "crates/onset",
    "crates/tracker",
    "crates/click",
    "crates/midiclock",
    "crates/sequencer",
    "crates/ui",
    "crates/app",
    "tools/clockgen",
    "tools/eval",
    "tools/uisim",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
alsa = "0.12"
libc = "0.2"
realfft = "3"
arc-swap = "1"
ringbuf = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
hound = "3"
anyhow = "1"
ctrlc = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
